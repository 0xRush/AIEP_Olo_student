  url: https://github.com/0xRush/AIEP_Olo_student/releases/download/data-v1/unseen_images.zip
  sha256: "3f32c9f243554d8975ba668fce2a100e60f2c60e31a5734d6f7a8a8867542564"
  size_mb: 0.43
  licence: "CC BY 2.0 / CC BY-SA 2.0 (Flickr, via COCO train2017)"
  source: "Held out from the same COCO CC-BY pool as small_image_5class; labels.csv marks the three out-of-class images"
  rows: 25
  target: class
  used_by: ["W4D5", "W6D4", "W8D1"]
  description_en: >
    Twenty-five images the model has never seen, in the same five classes. Used as the
    honest final check in W6D1 and W6D4, and as what the saved artifact loads and
    predicts on in W8D1 — the capstone's requirement 4 in miniature.
  description_ar: >
    خمس وعشرون صورة لم يرها النموذج قط، من الفئات الخمس نفسها. تُستخدم كتحقّق نهائي صادق
    في الأسبوع السادس، وهي ما يُحمّله الأثر المحفوظ ويتنبّأ به في الأسبوع الثامن اليوم
    الأول — أي المتطلّب الرابع لمشروع التخرّج مصغَّرًا.
  gotcha_en: "Three images are elephants — a class no lab trains on; labels.csv marks them in_or_out=out. A good service says 'low confidence', not a wrong label."
  gotcha_ar: "ثلاث صور من فئات لم يُدرَّب عليها النموذج. والخدمة الجيّدة تقول «ثقة منخفضة» ولا تعطي تسمية خاطئة."

