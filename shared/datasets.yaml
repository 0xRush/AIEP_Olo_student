  source: "fancyzhx/amazon_polarity (English) + Ruqiya/Arabic_Reviews_of_SHEIN (Arabic), sampled and balanced"
  rows: 12000
  target: sentiment
  used_by: ["W5D1", "W5D2", "W5D4", "W5D5"]
  description_en: >
    Product reviews with a sentiment label. Used for the TF-IDF baseline (W5D1), the
    embedding comparison (W5D2) and the BERT fine-tune (W5D5), so every approach is
    measured on identical data — which is the entire point of assignment A5.
  description_ar: >
    مراجعات منتجات مع تسمية للمشاعر. تُستخدم لخط الأساس بـ TF-IDF (الأسبوع ٥ اليوم ١)
    وللمقارنة بالتمثيلات (اليوم الثاني) ولضبط BERT (اليوم الخامس)، فتُقاس كل الطرائق على
    البيانات نفسها — وهذا هو جوهر التكليف الخامس.
  gotcha_en: "About 4% of reviews are in a different language from the rest. TF-IDF ignores them; BERT partly doesn't."
  gotcha_ar: "نحو ٤٪ من المراجعات بلغة مختلفة عن البقية. يتجاهلها TF-IDF، بينما لا يتجاهلها BERT كليًا."

sentence_embeddings_sample:
  file: sentence_embeddings_sample.parquet
  url: https://github.com/0xRush/AIEP_Olo_student/releases/download/data-v1/sentence_embeddings_sample.parquet
  sha256: "4e6a15dfda934fd7022404b444f840c7729a9730123b72cf914aafcf45295fbe"
  size_mb: 78.23
  licence: "Apache 2.0 (all-MiniLM-L6-v2); the token list is MIT"
  source: "hermitdave/FrequencyWords token list, embedded with sentence-transformers all-MiniLM-L6-v2 for this course"
  rows: 50000
  target: null
  used_by: ["W5D2"]
  description_en: >
    Precomputed 384-dimensional sentence-transformer embeddings over a 50,000-token
    vocabulary, so the W5D2 similarity and nearest-neighbour work loads in seconds on
    classroom Wi-Fi instead of embedding a corpus live. This entry REPLACED the previous
    GloVe file: the revised programme document removed Word2Vec, GloVe and FastText, so
    embeddings are taught with the model students would actually reach for today. The
    concepts the lab teaches — embedding space, cosine similarity, nearest neighbours —
    are unchanged.
  description_ar: >
    تمثيلات متّجهية مُحسَّبة مسبقًا بـ ٣٨٤ بُعدًا لمعجم من ٥٠٠٠٠ رمز، ليُحمّل معمل التشابه
    والجيران الأقرب في ثوانٍ على شبكة القاعة بدل حساب التمثيلات مباشرةً. هذا المدخل
    **بديل** لملف GloVe السابق: فقد حذفت الوثيقة المُعدَّلة Word2Vec وGloVe وFastText،
    فصارت التمثيلات تُدرَّس بالنموذج الذي يستخدمه الطالب فعلًا اليوم. والمفاهيم التي
    يُعلّمها المعمل — فضاء التمثيل وجيب التمام والجيران الأقرب — لم تتغيّر.
  gotcha_en: "These vectors carry the biases of their training corpus, exactly as GloVe did. W5D2 task 5 measures one — discuss it, don't skip it."
  gotcha_ar: "تحمل هذه المتّجهات تحيّزات مُدوّنتها التدريبية كما كانت GloVe، ويقيس المعمل أحدها — ناقشه ولا تتجاوزه."

policy_docs:
  file: policy_docs.zip
  url: https://github.com/0xRush/AIEP_Olo_student/releases/download/data-v1/policy_docs.zip
  sha256: null
  size_mb: null
  licence: "CC0 (classroom fixture)"
  source: "Written for this course"
  rows: 24
  target: null
  used_by: ["W7D1", "W7D2", "W7D3", "W7D4", "W7D5"]
  description_en: >
    Twenty-four short policy documents for a fictional company. Nothing in them exists in
    any model's training data, so an ungrounded LLM must hallucinate — which is how W7D3
    proves why RAG is needed. Ships with a question set whose answers are all in the docs,
    plus deliberately out-of-scope questions the system must refuse.
  description_ar: >
    أربع وعشرون وثيقة سياسات قصيرة لشركة متخيَّلة. لا يوجد شيء منها في بيانات تدريب أي
    نموذج، فيضطر النموذج غير المُسنَد إلى الهلوسة — وبهذا يُثبت الأسبوع ٧ اليوم ٣ الحاجة
    إلى RAG. ومعها مجموعة أسئلة إجاباتها كلها في الوثائق، وأسئلة خارج النطاق عمدًا يجب
    أن يرفضها النظام.
  gotcha_en: "Two documents contradict each other on one policy. A good RAG answer cites both; a bad one picks whichever chunk ranked first."
  gotcha_ar: "وثيقتان تتناقضان في سياسة واحدة. الإجابة الجيّدة تستشهد بكلتيهما، والسيئة تأخذ المقطع الأعلى ترتيبًا فقط."

