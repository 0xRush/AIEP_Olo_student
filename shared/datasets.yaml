    Forty evaluation questions over policy_docs, each with the ground-truth answer and
    the source document. Thirty are answerable; ten are deliberately out of scope, so
    faithfulness and refusal can both be measured.
  description_ar: >
    أربعون سؤال تقييم على وثائق السياسات، مع الإجابة المرجعية والوثيقة المصدر لكل سؤال.
    ثلاثون منها قابلة للإجابة وعشرة خارج النطاق عمدًا، فيمكن قياس الأمانة للمصدر والرفض معًا.
  gotcha_en: "A system that answers all 40 scores worse than one that refuses the 10 — refusing correctly is the skill."
  gotcha_ar: "النظام الذي يجيب عن الأربعين جميعًا أسوأ من الذي يرفض العشرة — والرفض في موضعه هو المهارة."

