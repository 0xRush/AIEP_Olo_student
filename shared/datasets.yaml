# Dataset registry for the AIEP bootcamp.
#
# Every dataset a lab uses is declared here BEFORE the lab is written.
# Notebooks call get_dataset("<key>") and never contain a file path.
# Full field reference: docs/Data_Guide.md
#
# ─── Status ──────────────────────────────────────────────────────────────────
# Entries below are the planned datasets per the curriculum. Before a cohort runs:
#   1. Source each file, check its licence, sample it down if needed.
#   2. Put it in shared/data_cache (< 5 MB) or upload it as a Release asset (>= 5 MB).
#   3. Run:  python tools/fetch_datasets.py --update-hashes
#      which fills in every `sha256: null` and `size_mb: null` from the actual files.
#   4. Commit the updated registry.
# `sha256: null` means "not yet pinned" — get_dataset still works, it just can't verify.
#
# `loader:` values:
#   (absent)     — a file we host; fetched from `url` into the cache
#   torchvision  — loaded by torchvision.datasets; entry exists only to document it
#   huggingface  — loaded by `datasets`/`transformers`; documentation only
#   manual       — licence forbids redistribution; the student downloads it themselves

# ═══════════════════════════════════════════════════════════════════════════════
# Weeks 1-3 — tabular
# ═══════════════════════════════════════════════════════════════════════════════

telco_churn:
  file: telco_churn.parquet
  url: https://raw.githubusercontent.com/0xRush/AIEP_Olo_student/master/shared/data_cache/telco_churn.parquet
  # Committed to shared/data_cache, so a clone never downloads it. The URL is for
  # Colab, which has no checkout and would otherwise reach the upload prompt.
  sha256: "54a20b92afcd4bd13fee03bd9a481b681323025007600a8aacf682b1c12263e9"
  size_mb: 0.2
  licence: "CC0 (public domain)"
  source: "https://www.kaggle.com/datasets/blastchar/telco-customer-churn"
  rows: 7043
  target: Churn
  used_by: ["W1D3", "W2D1", "W2D2", "W2D5", "W8D1"]
  description_en: >
    Telecom customer records with a churn label. Mixed numeric and categorical columns,
    a genuinely imbalanced target (~27% churn), and enough messiness to carry the whole
    of weeks 1-3 without students restarting on a new dataset every day.
  description_ar: >
    سجلات عملاء اتصالات مع عمود يوضّح مغادرة العميل للخدمة. أعمدة رقمية وفئوية مختلطة،
    وهدف غير متوازن فعليًا (نحو ٢٧٪)، وفيها من الفوضى ما يكفي لتغطية الأسابيع الثلاثة
    الأولى دون أن يبدأ الطلاب من مجموعة بيانات جديدة كل يوم.
  gotcha_en: "TotalCharges is stored as text and is blank for customers with tenure = 0."
  gotcha_ar: "عمود TotalCharges مخزّن كنص ويكون فارغًا للعملاء الذين مدّة اشتراكهم صفر."

housing_prices:
  file: housing_prices.parquet
  url: https://raw.githubusercontent.com/0xRush/AIEP_Olo_student/master/shared/data_cache/housing_prices.parquet
  # Committed to shared/data_cache, so a clone never downloads it. The URL is for
  # Colab, which has no checkout and would otherwise reach the upload prompt.
  sha256: "2ed310bc105a86916266cfa09ca133e862342cd6bf497d73e05ea0d9809149a4"
  size_mb: 0.81
  licence: "Public domain (StatLib, 1990 US Census derived)"
  source: "California Housing via sklearn.datasets.fetch_california_housing"
  rows: 20640
  target: median_house_value
  used_by: ["W1D1", "W1D2"]
  description_en: >
    Housing blocks with median price as the target. The regression counterpart to
    telco_churn: used for the first end-to-end model (W1D1) and for gradient descent
    from scratch (W1D2), where a single feature keeps the arithmetic visible.
  description_ar: >
    بيانات أحياء سكنية مع متوسط السعر كهدف. النظير الانحداري لمجموعة telco_churn،
    وتُستخدم في أول نموذج متكامل (الأسبوع ١ اليوم ١) وفي طريقة النزول التدريجي من الصفر
    (الأسبوع ١ اليوم ٢) حيث تُبقي خاصية واحدة الحساب مرئيًا.
  gotcha_en: "The target is capped at 500001 — a wall of points at the maximum that quietly breaks the fit."
  gotcha_ar: "الهدف مقصوص عند القيمة ٥٠٠٠٠١، فتتكدّس نقاط كثيرة عند الحد الأقصى وتُفسد المطابقة بصمت."

credit_default:
  file: credit_default.parquet
  url: https://raw.githubusercontent.com/0xRush/AIEP_Olo_student/master/shared/data_cache/credit_default.parquet
  # Committed to shared/data_cache, so a clone never downloads it. The URL is for
  # Colab, which has no checkout and would otherwise reach the upload prompt.
  sha256: "111a6532f406aae8210cfd61bd49ca165ff0a1d346d0fe27e8f95ec269fb7d54"
  size_mb: 1.75
  licence: "CC BY 4.0"
  source: "UCI Default of Credit Card Clients"
  rows: 30000
  target: default_next_month
  used_by: ["W1D4", "W3D1", "W3D5"]
  description_en: >
    Credit-card clients with a default flag. Used for evaluation under class imbalance
    (W1D4) and for trees and ensembles (W3D1), where feature importance has a meaning
    students can argue about.
  description_ar: >
    عملاء بطاقات ائتمانية مع مؤشّر التعثّر. تُستخدم في التقييم مع اختلال توازن الفئات
    (الأسبوع ١ اليوم ٤) وفي النماذج الشجرية (الأسبوع ٣ اليوم ١) حيث تحمل أهمية الخصائص
    معنى يستحق النقاش.
  gotcha_en: "PAY_0..PAY_6 use an undocumented coding where -2, -1 and 0 all mean 'not late'."
  gotcha_ar: "الأعمدة PAY_0 إلى PAY_6 تستخدم ترميزًا غير موثّق تعني فيه القيم -2 و-1 و0 جميعها «غير متأخّر»."

customer_segments:
  file: customer_segments.parquet
  url: https://raw.githubusercontent.com/0xRush/AIEP_Olo_student/master/shared/data_cache/customer_segments.parquet
  # Committed to shared/data_cache, so a clone never downloads it. The URL is for
  # Colab, which has no checkout and would otherwise reach the upload prompt.
  sha256: "c097245b06d3266f9f25475fed02a3882d5b5874e3d3c6121bed12dea488dea9"
  size_mb: 0.17
  licence: "CC0"
  source: "Retail transactions aggregated to customer level (classroom fixture)"
  rows: 4372
  target: null
  used_by: ["W1D5"]
  description_en: >
    Customer-level spending features with no label — clustering has to justify itself
    without an accuracy score, which is the actual lesson of the day.
  description_ar: >
    خصائص إنفاق على مستوى العميل بلا تسمية — على التجميع أن يبرّر نفسه دون مقياس دقة،
    وهذا هو الدرس الحقيقي لليوم.
  gotcha_en: "Spend columns are heavily right-skewed; K-Means on raw values finds one giant cluster and a few outliers."
  gotcha_ar: "أعمدة الإنفاق ملتوية بشدة نحو اليمين؛ وتطبيق K-Means على القيم الخام ينتج عنقودًا ضخمًا وبضع قيم شاذّة."

messy_sales:
  file: messy_sales.csv
  url: https://raw.githubusercontent.com/0xRush/AIEP_Olo_student/master/shared/data_cache/messy_sales.csv
  # Committed to shared/data_cache, so a clone never downloads it. The URL is for
  # Colab, which has no checkout and would otherwise reach the upload prompt.
  sha256: "c63e5dcc330215fdb9ca44a22be867854dd44267acdfc91a957715e8113f6108"
  size_mb: 0.38
  licence: "CC0 (classroom fixture, generated)"
  source: "Built for this course"
  rows: 5000
  target: revenue
  used_by: ["W2D3", "W2D4"]
  description_en: >
    Deliberately broken data: missing values in three different patterns, dates in four
    formats, 120 duplicated rows, fourteen spellings of five cities, and one column that
    leaks the target. Built so every cleaning technique in W2D3 has something real to fix.
    Generated by tools/make_datasets.py, which audits all six defects on every build.
  description_ar: >
    بيانات معطوبة عمدًا: قيم مفقودة بثلاثة أنماط مختلفة، وتواريخ بأربع صيغ، ومئة وعشرون
    صفًا مكرّرًا، وأربع عشرة تهجئة لخمس مدن، وعمود واحد يُسرّب الهدف. صُمّمت ليجد كل أسلوب
    تنظيف في الأسبوع الثاني اليوم الثالث شيئًا حقيقيًا يصلحه. ويولّدها ملف
    tools/make_datasets.py الذي يفحص العيوب الخمسة في كل توليد.
  gotcha_en: "The whole file is the gotcha. `commission_paid` is a flat 3% of `revenue`,
    paid after the revenue is recognised, so it does not exist at prediction time and no
    order-time column produces it. It predicts the target at r=1.000 — a model holding it
    scores R2 = 1.0, which is the tell — and it must go."
  gotcha_ar: "الملف كله مشكلة. عمود `commission_paid` هو ٣٪ من `revenue` تُدفع بعد الاعتراف
    بالإيراد، فلا وجود له وقت التنبّؤ ولا يُنتجه أي عمود معروف وقت الطلب. ويتنبّأ بالهدف بمعامل
    ارتباط ١٫٠٠٠ — فالنموذج الذي يحمله يحقّق R² يساوي واحدًا، وهذه هي العلامة — ويجب حذفه."

# ═══════════════════════════════════════════════════════════════════════════════
# Weeks 3-6 — neural networks, vision and representations
# ═══════════════════════════════════════════════════════════════════════════════

moons_toy:
  file: moons_toy.parquet
  url: https://github.com/0xRush/AIEP_Olo_student/releases/download/data-v1/moons_toy.parquet
  sha256: "9a5ba549dc7875798e2e047e7b32464776c9a5441516c25a108119610809caec"
  size_mb: 0.01
  licence: "CC0 (generated with sklearn.datasets.make_moons, seed 42)"
  source: "Built for this course"
  rows: 500
  target: label
  used_by: ["W3D2", "W3D3", "W3D4", "W3D5"]
  description_en: >
    Two interleaving half-moons — not linearly separable, small enough to train a
    from-scratch NumPy network on in seconds, and 2-D so the decision boundary can be
    drawn. Used across W3D2-D5 so students compare like with like all week.
  description_ar: >
    هلالان متداخلان — غير قابلين للفصل خطيًا، وصغيران بما يكفي لتدريب شبكة مكتوبة من
    الصفر بـ NumPy في ثوانٍ، وثنائيا البعد فيمكن رسم حدّ القرار. يُستخدمان من اليوم الثاني
    إلى الخامس في الأسبوع الثالث ليقارن الطلاب المتشابه بالمتشابه طوال الأسبوع.
  gotcha_en: "Noise is set to 0.2, so perfect accuracy is impossible — a student chasing 100% is overfitting."
  gotcha_ar: "الضوضاء مضبوطة على ٠٫٢، فالدقة الكاملة مستحيلة؛ ومن يطارد ١٠٠٪ فهو يقع في فرط المطابقة."

mnist:
  loader: torchvision
  file: null
  sha256: null
  size_mb: 11
  licence: "CC BY-SA 3.0"
  source: "http://yann.lecun.com/exdb/mnist/"
  rows: 70000
  target: digit
  used_by: ["W4D2"]
  description_en: >
    28x28 greyscale handwritten digits. Downloaded and cached by torchvision on first
    use; do not call get_dataset for this one.
  description_ar: >
    أرقام مكتوبة بخط اليد بحجم ٢٨×٢٨ بتدرّج رمادي. يُنزّلها torchvision ويخزّنها عند أول
    استخدام؛ ولا تُستدعى عبر get_dataset.
  gotcha_en: "MNIST is unrealistically easy. A near-perfect score here says nothing about real vision work — say so."
  gotcha_ar: "MNIST سهلة على نحو غير واقعي، والنتيجة شبه الكاملة فيها لا تدلّ على شيء في الرؤية الحاسوبية الحقيقية — صرّح بذلك."

fashion_mnist:
  loader: torchvision
  file: null
  sha256: null
  size_mb: 30
  licence: "MIT"
  source: "https://github.com/zalandoresearch/fashion-mnist"
  rows: 70000
  target: garment_class
  used_by: ["W4D2"]
  description_en: >
    Same shape as MNIST, genuinely harder. Used as the "now try it on something real"
    step after the MNIST CNN, and for filter visualisation.
  description_ar: >
    بالحجم نفسه لـ MNIST لكنها أصعب فعليًا. تُستخدم كخطوة «جرّبها الآن على شيء حقيقي»
    بعد شبكة MNIST، وفي تصوّر المُرشِّحات.
  gotcha_en: "Shirt vs coat vs pullover are confusable at 28x28 even for humans — the confusion matrix shows it."
  gotcha_ar: "التمييز بين القميص والمعطف والكنزة صعب عند دقة ٢٨×٢٨ حتى على الإنسان، وتُظهر مصفوفة الالتباس ذلك."

sample_photos:
  file: sample_photos.zip
  url: https://github.com/0xRush/AIEP_Olo_student/releases/download/data-v1/sample_photos.zip
  sha256: "48162096f42e91aff7b4d7a29d2193ae97c909e2af5aa127b8650bc203af256c"
  size_mb: 1.83
  licence: "CC BY 2.0 / CC BY-SA 2.0 (Flickr, via COCO train2017)"
  source: "Cut from the Attribution-licensed subset of COCO train2017; ATTRIBUTION.csv in the zip credits every photograph"
  rows: 20
  target: null
  used_by: ["W4D1", "W4D3", "W6D1"]
  description_en: >
    Twenty photographs at 640px on the longest side, used three times: hand-written
    convolution (W4D1), the object detection lab (W4D3), and ViT attention maps (W6D1).
    Street scenes carrying at least two of person / car / stop sign, plus two hard cases
    where detection fails. The two hard ones were picked by measurement, not by eye:
    yolos-tiny finds 0% and 33% of their ground-truth boxes at confidence 0.5, and
    HARD_IMAGES.txt in the zip names them. The reuse is the point — by W4D3 students
    already know these images.
  description_ar: >
    عشرون صورة بطول ٦٤٠ بكسل للضلع الأطول، تُستخدم ثلاث مرات: تطبيق الالتفاف يدويًا
    (الأسبوع ٤ اليوم ١)، ومعمل كشف الكائنات (اليوم الثالث)، وخرائط انتباه محوّل الرؤية
    (الأسبوع ٦ اليوم ١). مشاهد شوارع تحوي فئتين على الأقل من: شخص، سيارة، لوحة قف. وفيها
    صورتان صعبتان اختيرتا بالقياس لا بالنظر: يجد yolos-tiny صفر٪ و٣٣٪ من صناديقهما عند
    ثقة ٠٫٥، وملف HARD_IMAGES.txt داخل الأرشيف يسمّيهما. وإعادة الاستخدام مقصودة: فالطالب
    يعرف هذه الصور قبل أن يصل إلى معمل الكشف.
  gotcha_en: "Two images are intentionally hard (heavy occlusion, unusual angle). The failure is the lesson."
  gotcha_ar: "صورتان صعبتان عمدًا (حجب شديد وزاوية غير معتادة). الفشل نفسه هو الدرس."

detection_boxes:
  file: detection_boxes.zip
  url: https://github.com/0xRush/AIEP_Olo_student/releases/download/data-v1/detection_boxes.zip
  sha256: "9787db07923c71cbb743cd27f402e40770bfb55c9f9abbfdb0c54a4d2d4cd0cf"
  size_mb: 10.67
  licence: "Annotations CC BY 4.0 (COCO); images CC BY 2.0 / CC BY-SA 2.0 (Flickr)"
  source: "COCO train2017 instance boxes, converted to pixel (x1, y1, x2, y2) at 640px"
  rows: 120
  target: bbox
  used_by: ["W4D3"]
  description_en: >
    554 ground-truth boxes over 120 street scenes in three classes — person (196),
    car (316) and stop sign (42), which is the traffic-sign class COCO actually has.
    `boxes.csv` covers the twenty images of `sample_photos` and the 100 further images
    shipped in `images/` here for the fine-tune stretch section. Boxes below 32x32 were
    dropped: yolos-tiny cannot find them, and ground truth no model can hit measures the
    annotation rather than the detector. Without these labels the detection lab can only
    LOOK at predictions; with them it can score IoU matches, precision, recall and
    mAP@0.5 — the whole difference between a demonstration and an evaluation.
  description_ar: >
    ٥٥٤ صندوقًا مرجعيًا على ١٢٠ مشهد شارع في ثلاث فئات: شخص (١٩٦)، وسيارة (٣١٦)، ولوحة
    قف (٤٢) وهي فئة اللوحات المرورية الموجودة فعلًا في COCO. يغطّي `boxes.csv` العشرين صورة
    في `sample_photos` والمئة صورة الإضافية المرفقة هنا في `images/` للقسم الإضافي الخاص
    بالضبط الدقيق. وحُذفت الصناديق الأصغر من ٣٢×٣٢ لأن yolos-tiny لا يجدها، والمرجع الذي لا
    يستطيع أي نموذج بلوغه يقيس التعليم لا الكاشف. وبلا هذه التسميات يستطيع معمل الكشف أن
    **ينظر** إلى التنبؤات فقط؛ ومعها يحسب التطابق بمقياس IoU والدقة والاستدعاء وmAP — وهذا
    هو الفرق كله بين العرض والتقييم.
  gotcha_en: "Boxes are (x1, y1, x2, y2) in PIXEL coordinates, not normalised. yolos-tiny returns normalised cxcywh — convert before computing IoU, or every number is silently wrong."
  gotcha_ar: "الصناديق بصيغة (x1, y1, x2, y2) بإحداثيات البكسل لا مُطبَّعة، بينما يُرجع yolos-tiny صيغة cxcywh مُطبَّعة — حوّلها قبل حساب IoU وإلا صارت كل الأرقام خاطئة بصمت."

small_image_5class:
  file: small_image_5class.zip
  url: https://github.com/0xRush/AIEP_Olo_student/releases/download/data-v1/small_image_5class.zip
  sha256: "459f55f7d42dda0374382c1fa7bd5d296fefabdf124900e2de42e2917be2e9d1"
  size_mb: 7.06
  licence: "CC BY 2.0 / CC BY-SA 2.0 (Flickr, via COCO train2017)"
  source: "COCO train2017 CC-BY subset, cropped to one subject per image: bus, cat, dog, pizza, zebra"
  rows: 400
  target: class
  used_by: ["W4D4", "W4D5", "W6D1", "W6D2", "W6D3", "W6D4", "W6D5"]
  description_en: >
    Five classes — bus, cat, dog, pizza, zebra — 80 images each at 224x224 in
    `ImageFolder` layout, so class 3 is `pizza`. Small on purpose. It carries W4D4-D5 (augmentation,
    then fine-tuning) and the whole of week 6 (autoencoder, MAE, linear probe, CLIP).
    Too small to train from scratch, which is exactly what makes augmentation and
    transfer learning visible. Keeping the same 400 images across both weeks is what
    makes W6D4's linear probe directly comparable with W4D5's supervised fine-tune —
    that comparison is the point of week 6, and swapping the dataset destroys it.
  description_ar: >
    خمس فئات — حافلة، وقطّ، وكلب، وبيتزا، وحمار وحشي — ثمانون صورة لكل فئة بحجم ٢٢٤×٢٢٤
    بترتيب `ImageFolder`، فالفئة رقم ٣ هي البيتزا. صغيرة عمدًا. تحمل اليومين الرابع والخامس من الأسبوع
    الرابع (زيادة البيانات ثم الضبط الدقيق) والأسبوع السادس كاملًا. أصغر من أن تُدرَّب من
    الصفر، وهذا بالضبط ما يجعل أثر زيادة البيانات والتعلّم بالنقل مرئيًا. وبقاء الصور
    الأربعمئة نفسها في الأسبوعين هو ما يجعل الفحص الخطي في الأسبوع السادس قابلًا للمقارنة
    مباشرةً بالضبط المُشرَف في الأسبوع الرابع — وتلك المقارنة هي جوهر الأسبوع السادس.
  gotcha_en: "Class 3 (pizza) has 12 near-duplicate images — a 97% crop, slightly brighter, re-encoded. A checksum finds nothing; a perceptual hash finds all 12 within 4 bits, and the closest ordinary pair is 14 bits apart. If a pair straddles the train/val split, accuracy is inflated."
  gotcha_ar: "الفئة رقم ٣ (البيتزا) تحوي ١٢ صورة شبه مكرّرة: قصٌّ بنسبة ٩٧٪ مع زيادة إضاءة طفيفة وإعادة ترميز. لا تجدها البصمة الرقمية (checksum)، بينما يجدها التجزيء الإدراكي كلها ضمن ٤ بتّات، وأقرب زوج عادي يبعد ١٤ بتًّا. وإذا توزّع زوج بين التدريب والتحقّق ارتفعت الدقة زورًا."

image_captions_small:
  file: image_captions_small.zip
  url: https://github.com/0xRush/AIEP_Olo_student/releases/download/data-v1/image_captions_small.zip
  sha256: null
  size_mb: null
  licence: "CC BY 2.0 (images); captions written for this course, CC0"
  source: "Curated image-caption pairs, one short caption per image"
  rows: 200
  target: null
  used_by: ["W6D5"]
  description_en: >
    Two hundred image-caption pairs for the CLIP cross-modal retrieval lab. Each image
    has exactly one known-correct caption, which is what makes Recall@1, Recall@5 and MRR
    computable in both directions — text-to-image and image-to-text are not equally good,
    and measuring that gap is the lab's finding. Includes a handful of pairs designed to
    fail: counting ("three cars"), spatial relations ("under the table"), text inside the
    image, and one Arabic-language caption.
  description_ar: >
    مئتا زوج من صورة وتعليق لمعمل الاسترجاع متعدّد الوسائط بـ CLIP. لكل صورة تعليق واحد
    صحيح معروف، وهذا ما يجعل مقاييس الاستدعاء والرتبة المتبادلة قابلة للحساب في الاتجاهين —
    فالبحث من النص إلى الصورة ليس بجودة العكس، وقياس هذه الفجوة هو نتيجة المعمل. وتشمل
    أزواجًا مصمّمة للفشل: العدّ («ثلاث سيارات»)، والعلاقات المكانية («تحت الطاولة»)، والنص
    داخل الصورة، وتعليقًا واحدًا بالعربية.
  gotcha_en: "The Arabic caption performs far worse than its English equivalent. That is the finding, not a broken file — web-scraped training data under-represents Arabic and the lab is meant to surface it."
  gotcha_ar: "التعليق العربي أداؤه أسوأ بكثير من مقابله الإنجليزي، وهذه هي النتيجة لا خلل في الملف: بيانات التدريب المسحوبة من الشبكة تُمثّل العربية تمثيلًا ناقصًا، والمعمل موجود ليُظهر ذلك."

unseen_images:
